<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Without Limits</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: white;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .without-limits-section {
      padding: 100px 20px;
      display: flex;
      align-items: center;
    }

    .subtitle {
      font-size: 1.2rem;
      color: #000 !important;
      font-weight: 500;
      margin-top: 16px;
    }

    h2 {
      font-size: 2.8rem;
      font-weight: 900;
      background: linear-gradient(90deg, #00B6FF, #00E38C);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
    }

    @media (min-width: 992px) {
      h2 {
        font-size: 4rem;
      }
    }
  </style>
</head>
<body>
  <section class="without-limits-section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-8 text-center">
          <div class="content-wrapper">
            <h2>Without Limits</h2>
            <p class="subtitle">Do More. Effort Less.</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script>
    gsap.registerPlugin(ScrollTrigger);

    gsap.from(".content-wrapper", {
      y: -100,
      opacity: 0,
      duration: 1.2,
      ease: "power3.out",
      scrollTrigger: {
        trigger: ".content-wrapper",
        start: "top 80%",
        toggleActions: "play none none reverse"
      }
    });
  </script>
</body>
</html>
