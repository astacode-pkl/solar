<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>highlights</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff;
        }
        .highlight-title {
            text-align: center;
            font-weight: 700;
            font-size: 4.5rem;
            background: linear-gradient(90deg, #00B6FF, #00E38C);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 50px 0 40px;
            line-height: 1.1;
            letter-spacing: -0.5px;
        }
        .highlight-img {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 20px;
            opacity: 0;
            transform: perspective(1000px) rotateX(-10deg) translateY(50px) scale(0.95);
            transform-origin: center bottom;
            transition: all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            will-change: transform, opacity;
        }

        .highlight-img.visible {
            opacity: 1;
            transform: perspective(1000px) rotateX(0) translateY(0) scale(1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
        }
        .container {
            max-width: 1200px;
            padding: 0 15px;
        }

        .row {
            margin-left: -5px;
            margin-right: -5px;
        }

        .col-12 {
            padding-left: 5px;
            padding-right: 5px;
        }
        @media (max-width: 768px) {
            .highlight-title {
                font-size: 2rem;
                margin: 25px 15px;
                line-height: 1.1;
                padding: 0 10px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="highlight-title">Get the X1 Highlights</h2>

    <div class="row">
        <div class="col-12">
            <img src="assets/img1.webp" alt="Highlight 1" class="highlight-img">
        </div>
        <div class="col-12">
            <img src="assets/img2.webp" alt="Highlight 2" class="highlight-img">
        </div>
        <div class="col-12">
            <img src="assets/img3.webp" alt="Highlight 3" class="highlight-img">
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const images = document.querySelectorAll('.highlight-img');

        function isInViewport(element) {
            const rect = element.getBoundingClientRect();
            return (
                rect.top <= (window.innerHeight * 0.8) &&
                rect.bottom >= (window.innerHeight * 0.2)
            );
        }

        function handleScroll() {
            images.forEach((img, index) => {
                if (isInViewport(img) && !img.classList.contains('visible')) {
                    // Set delay yang berbeda untuk setiap gambar
                    setTimeout(() => {
                        img.classList.add('visible');
                    }, index * 100); // 200ms delay antar gambar
                }
            });
        }

        window.addEventListener('scroll', handleScroll);

        handleScroll();
    });
</script>
</body>
</html>
